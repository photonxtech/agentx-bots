<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeNext Document QA Assistant</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            --panel-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent-hover: #4338ca;
            --user-bubble: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --bot-bubble: rgba(31, 41, 55, 0.85);
            --font-main: 'Inter', sans-serif;
            --font-title: 'Outfit', sans-serif;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Glassmorphic App Container */
        .app-container {
            width: 95%;
            max-width: 900px;
            height: 90vh;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header Styling */
        .chat-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 15, 26, 0.4);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        /* Document Badge Panel */
        .doc-badge-panel {
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .doc-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .doc-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #c7d2fe;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .doc-icon {
            font-size: 0.8rem;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            width: 100%;
            animation: bubbleSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message-bubble {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .message-row.user .message-bubble {
            max-width: 75%;
        }

        .message-row.user .message-bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .message-row.bot .message-bubble {
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 6px;
            display: block;
            text-align: right;
        }

        .message-row.user .message-time {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Typography spacing in markdown responses */
        .message-bubble p {
            margin-bottom: 8px;
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }
        .message-bubble ul, .message-bubble ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .cite-ref {
            font-size: 0.75em;
            color: #a5b4fc;
            font-weight: 600;
            vertical-align: super;
            line-height: 0;
        }

        .citations-dropdown {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .citations-dropdown[open] {
            border-color: rgba(99, 102, 241, 0.35);
        }

        .citations-dropdown summary {
            list-style: none;
            cursor: pointer;
            padding: 8px 14px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .citations-dropdown summary::-webkit-details-marker {
            display: none;
        }

        .citations-dropdown summary::before {
            content: '';
            width: 0;
            height: 0;
            border-left: 5px solid var(--text-secondary);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .citations-dropdown[open] summary::before {
            transform: rotate(90deg);
        }

        .citations-dropdown summary:hover {
            color: #c7d2fe;
            background: rgba(99, 102, 241, 0.08);
        }

        .citations-icon {
            font-size: 0.85rem;
        }

        .citations-list {
            padding: 0 14px 10px;
            margin: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid var(--border-color);
        }

        .citation-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            padding-top: 8px;
        }

        .citation-item:first-child {
            padding-top: 10px;
        }

        .citation-index {
            flex-shrink: 0;
            background: rgba(99, 102, 241, 0.2);
            color: #c7d2fe;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1.4;
        }

        .citation-source {
            color: #d1d5db;
            line-height: 1.4;
        }

        .citation-page {
            color: var(--text-secondary);
        }

        /* Loading Indicator Bubble */
        .typing-loader {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-loader span {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-loader span:nth-child(1) { animation-delay: -0.32s; }
        .typing-loader span:nth-child(2) { animation-delay: -0.16s; }

        /* Input Panel */
        .chat-input-panel {
            padding: 20px 28px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(10, 15, 26, 0.3);
        }

        .input-form {
            display: flex;
            gap: 12px;
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px 6px 6px 16px;
            transition: all 0.3s ease;
        }

        .input-form:focus-within {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            padding: 10px 0;
            resize: none;
            height: 44px;
            max-height: 120px;
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .btn-send {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-send:active {
            transform: scale(0.98);
        }

        .btn-send svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: rotate(45deg);
            margin-left: -2px;
            margin-top: 2px;
        }

        .input-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes bubbleSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Responsiveness */
        @media (max-width: 600px) {
            .app-container {
                height: 100vh;
                width: 100%;
                border-radius: 0;
                border: none;
            }
            body {
                padding: 0;
            }
            .chat-messages {
                padding: 16px;
            }
            .chat-header {
                padding: 16px 20px;
            }
            .doc-badge-panel {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="brand-info">
                <h1 class="brand-name">WeNext RAG Chatbot</h1>
                <div class="brand-subtitle">
                    <span class="status-dot"></span>
                    <span>Knowledge Assistant</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-action" id="btnClear" title="Clear Conversation History">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    Clear Chat
                </button>
            </div>
        </header>

        <!-- Document Badges (shows what documents are ingested) -->
        <div class="doc-badge-panel" id="docBadgePanel">
            <span class="doc-label">Ingested Sources:</span>
            <span class="doc-label" id="docBadgeLoading">Loading...</span>
        </div>

        <!-- Chat Area -->
        <main class="chat-messages" id="chatMessages">
            <!-- Initial Greeting -->
            <div class="message-row bot">
                <div class="message-bubble">
                    <p>Hello! I am your WeNext Document Assistant. Feel free to ask your questions.</p>
                    <span class="message-time" id="greetingTime">12:00 PM</span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-panel">
            <form class="input-form" id="chatForm">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Ask something about WeNext dashboard or WhatsApp FAQs..."
                    autocomplete="off"
                    required
                />
                <button type="submit" class="btn-send" id="btnSend">
                    <svg viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="input-info">Answers are sourced strictly from your ingested PDFs using RAG.</div>
        </footer>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');
        const btnClear = document.getElementById('btnClear');
        const greetingTime = document.getElementById('greetingTime');
        const docBadgePanel = document.getElementById('docBadgePanel');
        const docBadgeLoading = document.getElementById('docBadgeLoading');

        // Set time for the initial greeting
        const now = new Date();
        greetingTime.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Retrieve or generate a session ID
        let sessionId = localStorage.getItem('chat_session_id');
        if (!sessionId) {
            sessionId = generateUUID();
            localStorage.setItem('chat_session_id', sessionId);
        }

        // Auto-load history from backend if session already exists
        window.addEventListener('DOMContentLoaded', async () => {
            loadIngestedSources();

            if (sessionId) {
                try {
                    const response = await fetch(`/api/sessions/${sessionId}`);
                    const data = await response.json();
                    if (data && data.history && data.history.length > 0) {
                        // Clear initial greeting to avoid duplication
                        chatMessages.innerHTML = '';
                        data.history.forEach(msg => {
                            appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
                        });
                    }
                } catch (e) {
                    console.log('Error fetching history:', e);
                }
            }
        });

        async function loadIngestedSources() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                docBadgeLoading.remove();

                const sources = data.indexed_sources && data.indexed_sources.length
                    ? data.indexed_sources
                    : (data.pdf_files_on_disk || []);

                if (sources.length === 0) {
                    const emptyBadge = document.createElement('span');
                    emptyBadge.className = 'doc-label';
                    emptyBadge.textContent = 'No PDFs indexed yet — add files to data/ and restart.';
                    docBadgePanel.appendChild(emptyBadge);
                    return;
                }

                sources.forEach(sourceName => {
                    const badge = document.createElement('div');
                    badge.className = 'doc-badge';
                    badge.innerHTML = `<span class="doc-icon">📄</span><span>${formatSourceName(sourceName)}</span>`;
                    docBadgePanel.appendChild(badge);
                });
            } catch (e) {
                docBadgeLoading.textContent = 'Could not load sources';
                console.log('Error fetching RAG status:', e);
            }
        }

        function formatSourceName(filename) {
            return filename
                .replace(/\.pdf$/i, '')
                .replace(/[_-]+/g, ' ')
                .replace(/\s+\(\d+\)$/, '')
                .trim();
        }

        // Form submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = chatInput.value.trim();
            if (!messageText) return;

            // Clear input field
            chatInput.value = '';

            // Append User Message
            appendMessage('user', messageText);

            // Append Loader for Bot
            const loaderId = appendLoader();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: messageText,
                        session_id: sessionId
                    }),
                });

                if (!response.ok) {
                    throw new Error('API server returned error');
                }

                const data = await response.json();
                
                // Update session ID if server returned a new one
                if (data.session_id && data.session_id !== sessionId) {
                    sessionId = data.session_id;
                    localStorage.setItem('chat_session_id', sessionId);
                }

                // Remove loader and append bot response
                removeLoader(loaderId);
                appendMessage('bot', data.reply);

            } catch (error) {
                console.error('Error sending message:', error);
                removeLoader(loaderId);
                appendMessage('bot', 'I am sorry, but I failed to contact the API server. Please check if the server is running.');
            }
        });

        // Clear button action
        btnClear.addEventListener('click', async () => {
            if (confirm('Are you sure you want to clear the conversation history?')) {
                try {
                    await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
                } catch (e) {
                    console.log('Error deleting session history:', e);
                }
                
                // Reset session
                sessionId = generateUUID();
                localStorage.setItem('chat_session_id', sessionId);
                
                // Clear UI messages
                chatMessages.innerHTML = '';
                
                // Re-append initial greeting
                appendMessage('bot', `<p>Hello! I am your WeNext Document Assistant. Feel free to ask your questions.</p>`);
            }
        });

        // Helper: Generate UUID
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Helper: Parse trailing citation lines from bot responses
        function parseBotMessage(text) {
            const lines = text.split('\n');
            const citations = [];
            let bodyEnd = lines.length;

            for (let i = lines.length - 1; i >= 0; i--) {
                const trimmed = lines[i].trim();
                if (!trimmed) {
                    if (citations.length > 0) {
                        bodyEnd = i;
                        continue;
                    }
                    continue;
                }

                const match = trimmed.match(/^\[(\d+)\]\s*(.+?)(?:,\s*Page\s*(\d+))?\.?\s*$/i);
                if (match) {
                    citations.unshift({
                        index: match[1],
                        source: match[2].trim(),
                        page: match[3] || null,
                    });
                    bodyEnd = i;
                } else if (citations.length > 0) {
                    break;
                }
            }

            const body = lines.slice(0, bodyEnd).join('\n').trim();
            return { body, citations };
        }

        function buildCitationsDropdown(citations) {
            const details = document.createElement('details');
            details.className = 'citations-dropdown';

            const summary = document.createElement('summary');
            summary.innerHTML = `<span class="citations-icon">📎</span><span>Sources (${citations.length})</span>`;
            details.appendChild(summary);

            const list = document.createElement('ul');
            list.className = 'citations-list';

            citations.forEach(citation => {
                const item = document.createElement('li');
                item.className = 'citation-item';

                const sourceLabel = formatSourceName(
                    citation.source.replace(/,\s*Page\s*\d+.*$/i, '').trim()
                );

                item.innerHTML = `
                    <span class="citation-index">[${citation.index}]</span>
                    <span class="citation-source">
                        ${sourceLabel}
                        ${citation.page ? `<span class="citation-page"> · Page ${citation.page}</span>` : ''}
                    </span>
                `;
                list.appendChild(item);
            });

            details.appendChild(list);
            return details;
        }

        // Helper: Format message text (basic markdown-like converter)
        function formatMessageText(text, isBot = false) {
            // Simple check: if already has HTML structure, return as is
            if (text.startsWith('<p>') || text.includes('<ul>')) {
                return text;
            }
            
            // Format bold tags: **text** -> <strong>text</strong>
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            if (isBot) {
                formatted = formatted.replace(/\[(\d+)\]/g, '<sup class="cite-ref">[$1]</sup>');
            }
            
            // Format list items: lines starting with "- " or "* " -> bullet items
            const lines = formatted.split('\n');
            let inList = false;
            
            const processedLines = lines.map(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    const itemContent = trimmed.substring(2);
                    let result = '';
                    if (!inList) {
                        inList = true;
                        result += '<ul style="margin-left: 20px; margin-bottom: 8px;">';
                    }
                    result += `<li>${itemContent}</li>`;
                    return result;
                } else {
                    let result = '';
                    if (inList) {
                        inList = false;
                        result += '</ul>';
                    }
                    if (trimmed) {
                        result += `<p>${trimmed}</p>`;
                    }
                    return result;
                }
            });
            
            let finalHTML = processedLines.join('');
            if (inList) {
                finalHTML += '</ul>';
            }
            
            return finalHTML;
        }

        // Helper: Append message to UI
        function appendMessage(sender, text) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', sender);

            let container = messageRow;
            let messageBody = text;
            let citations = [];

            if (sender === 'bot') {
                const parsed = parseBotMessage(text);
                messageBody = parsed.body || text;
                citations = parsed.citations;

                const contentWrap = document.createElement('div');
                contentWrap.classList.add('message-content');
                container = contentWrap;
                messageRow.appendChild(contentWrap);
            }
            
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            
            bubble.innerHTML = formatMessageText(messageBody, sender === 'bot');
            
            const timeSpan = document.createElement('span');
            timeSpan.classList.add('message-time');
            timeSpan.textContent = timeStr;
            bubble.appendChild(timeSpan);

            container.appendChild(bubble);

            if (sender === 'bot' && citations.length > 0) {
                container.appendChild(buildCitationsDropdown(citations));
            }
            
            chatMessages.appendChild(messageRow);
            
            scrollToBottom();
        }

        // Helper: Append typing loader
        function appendLoader() {
            const loaderId = 'loader_' + Date.now();
            
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', 'bot');
            messageRow.id = loaderId;
            
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            
            const loaderDiv = document.createElement('div');
            loaderDiv.classList.add('typing-loader');
            loaderDiv.innerHTML = '<span></span><span></span><span></span>';
            
            bubble.appendChild(loaderDiv);
            messageRow.appendChild(bubble);
            chatMessages.appendChild(messageRow);
            
            scrollToBottom();
            return loaderId;
        }

        // Helper: Remove loader
        function removeLoader(loaderId) {
            const loader = document.getElementById(loaderId);
            if (loader) {
                loader.remove();
            }
        }

        // Helper: Scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
